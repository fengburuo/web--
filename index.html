<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>个人名片</title>
    <!-- 引入外部样式表 -->
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- 名片卡片容器 -->
    <div class="card">
        <!-- 圆形头像区域 -->
        <div class="avatar">
            <img src="https://api.dicebear.com/7.x/initials/svg?seed=ZhangSan" alt="头像">
        </div>
        <!-- 个人信息区域 -->
        <div class="info">
            <h1 class="name">张三</h1>
            <p class="position">前端开发工程师</p>
        </div>
        <!-- 联系方式区域 -->
        <div class="contact">
            <div class="contact-item">
                <span class="label">邮箱</span>
                <span class="value">zhangsan@example.com</span>
            </div>
            <div class="contact-item">
                <span class="label">电话</span>
                <span class="value">138-0000-0000</span>
            </div>
            <div class="contact-item">
                <span class="label">地址</span>
                <span class="value">北京市朝阳区</span>
            </div>
        </div>
    </div>
</body>
</html>
