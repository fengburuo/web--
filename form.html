<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>注册表</title>
    <style>
        textarea{
            resize: none;
        }
    </style>
</head>
<body>
    <form action="" method="post">
        <table align="center" width="500px" >
            <caption>注册表</caption>
        <caption>青春不常在，抓紧谈恋爱</caption>
            <tr>
                <td><label for="">姓名</label></td>
                <td><input type="text"></td>
            </tr>
            <tr>
                <td><label for="">性别</label></td>
                <td><input type="radio"name="xb">男<input type="radio"name="xb">女 </td>
            </tr>
            <tr>
                <td><label for="">生日</label></td>
                <td><input type="date"></td>
            </tr>
            <tr>
                <td><label for="">省份</label></td>
                <td>
                    <select name="" id="">
                        <option value="四川">四川</option>
                        <option value="重庆">重庆</option>
                        <option value="贵州">贵州</option>
                        <option value="云南">云南</option>
                        <option value="西藏">西藏</option>  
                        <option value="陕西">陕西</option>
                        <option value="甘肃">甘肃</option>
                        <option value="青海">青海</option>
                    </select>   
                </td>
            </tr>
            <tr>
                <td><label for="">学历</label></td>
                <td>
                    <select name="" id="">
                        <option value="小学">小学</option>
                        <option value="初中">初中</option>
                        <option value="高中">高中</option>
                        <option value="大专">大专</option>
                        <option value="本科">本科</option>  
                        <option value="研究生">研究生</option>
                        <option value="博士">博士</option>
                    </select>
                </td>
            </tr>
            <tr>
                <td><label for="">手机号</label></td>
                <td><input type="tel" pattern="^1[3-9]\d{9}$" ></td>
            </tr>
            <tr>
                <td><label for="">邮箱</label></td>
                <td><input type="email" ></td>
            </tr>
            <tr>
                <td><label for="">创建密码</label></td>
                <td><input type="password" placeholder="8-20位字母与数字的组合"></td>
            </tr>
            <tr>
                <td><label for="">爱好</label></td>
                <td>
                    <input type="checkbox" name="hobby">唱歌
                    <input type="checkbox" name="hobby">跳舞
                    <input type="checkbox" name="hobby">打球
                    <input type="checkbox" name="hobby">旅游
                    <input type="checkbox" name="hobby">看书
                </td>
            </tr>
            <tr>
                <td><label for="">幸运数字</label></td>
                <td><input type="number"  min="0" max="10">0<input type="range" min="0" max="100"step="5">100</td>
            </tr>
            <tr>
                <td><label for="">喜欢的颜色</label></td>
                <td><input type="color"></td>
            </tr>
            <tr>
                <td><label for="">个人简介</label></td>
                <td><textarea name="" id="" cols="30" rows="5"></textarea></td>
            </tr>
            <tr>
                <td><label for="">个人照片</label></td>
                <td><input type="file"></td>
            </tr>
            <tr>
                <td></td>
                <td>
                    <input type="button" value="注册" style=";background-color: #007bff;color: white;">
                    <input type="reset" value="重置" style="background-color: #6c757d;color: white;">
                    <input type="submit" value="提交" style="background-color: #28a745;color: white;">
                </td>
            </tr>
        </table>
    </form>
</body>
</html>
